    <style>

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

            text-align: center;

            padding: 20px;

            color: #333;

            transition:
                background 0.3s ease;

        }


        /* -------------------------------------------------
           卡片
        ------------------------------------------------- */

        .card {

            background: white;

            max-width: 400px;

            margin: 30px auto;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.1);

        }


        h2 {

            color: #007bff;

            margin-bottom: 20px;

        }


        /* -------------------------------------------------
           輸入區
        ------------------------------------------------- */

        .input-group {

            margin: 20px 0;

            text-align: left;

        }
        
        .input-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 16px;

            color: #555;

        }


        .input-field {

            display: block;

            width: 100%;

            padding: 12px;

            font-size: 18px;

            border:
                2px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

        }

        .proxy-input-field{

            display: block;

            width: 100%;

            padding: 12px;

            font-size: 18px;

            border:
                2px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            background-color: #fff8e1;

        }


        .input-field:focus {

            border-color: #007bff;

            outline: none;

        }


        /* -------------------------------------------------
           按鈕
        ------------------------------------------------- */

        .btn {

            display: block;

            width: 100%;

            padding: 15px;

            margin: 15px 0;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;

            font-weight: bold;

        }


        .btn-lunch {

            background-color: #28a745;

            color: white;

        }


        .btn-lunch:hover {

            background-color: #218838;

        }


        .btn:disabled {

            background-color: #999;

            cursor: not-allowed;

        }


        /* -------------------------------------------------
           狀態訊息
        ------------------------------------------------- */

        .status {

            margin-top: 20px;

            font-weight: bold;

            font-size: 16px;

            line-height: 1.8;

            min-height: 24px;

            text-align: left;

            word-break: break-word;

        }


        .status-title {

            text-align: center;

            font-size: 18px;

            margin-bottom: 10px;

        }


        .result-success {

            color: #28a745;

        }


        .result-fail {

            color: #dc3545;

        }


        .hint {

            font-size: 12px;

            color: #888;

            text-align: center;

            margin-top: 5px;

        }


        /* -------------------------------------------------
           午餐 / 晚餐
        ------------------------------------------------- */

        .meal-options {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .meal-option {

            flex: 1;

            cursor: pointer;

        }


        .meal-option input {

            display: none;

        }


        .meal-option span {

            display: block;

            padding: 14px 10px;

            text-align: center;

            border:
                2px solid #ccc;

            border-radius: 8px;

            background-color: #fff;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;

        }


        .meal-option input:checked + span {

            background-color: #007bff;

            color: white;

            border-color: #007bff;

        }


        /* -------------------------------------------------
           分頁
        ------------------------------------------------- */

        .tabs {

            display: flex;

            justify-content: space-around;

            margin-bottom: 20px;

            border-bottom:
                2px solid #ddd;

        }


        .tab-btn {

            background: none;

            border: none;

            padding: 10px 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: #666;

            border-bottom:
                3px solid transparent;

            transition: 0.2s;

        }


        .tab-btn.active {

            color: #007bff;

            border-bottom-color:
                #007bff;

        }


        .tab-content {

            display: none;

        }


        .tab-content.active {

            display: block;

        }


        /* -------------------------------------------------
           多日日期
        ------------------------------------------------- */

        .date-checkbox-list {

            display: grid;

            grid-template-columns:
                repeat(1, 1fr);

            gap: 10px;

            max-height: 250px;

            overflow-y: auto;

            border:
                2px solid #ccc;

            border-radius: 8px;

            padding: 10px;

            background: #fafafa;

        }


        .date-item {

            display: flex;

            align-items: center;

            padding: 8px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 6px;

            cursor: pointer;

        }


        .date-item:hover {

            background: #f0f8ff;

        }


        .date-item input {

            margin-right: 8px;

            transform: scale(1.2);

        }


        /* -------------------------------------------------
           午餐背景
        ------------------------------------------------- */

        body.white-mode {

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

        }


        /* -------------------------------------------------
           晚餐背景
        ------------------------------------------------- */

        body.dark-mode {

            background:
                linear-gradient(
                    135deg,
                    #0F172A 0%,
                    #1E1B4B 100%
                );

        }


        body.dark-mode .card {

            background: #f8fafc;

        }

    /* =================================================
       員工資料查詢視窗
    ================================================= */
    
    .loading-overlay {
    
        display: none;
    
        position: fixed;
    
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    
        background: rgba(0, 0, 0, 0.55);
    
        z-index: 99999;
    
        justify-content: center;
    
        align-items: center;
    
    }
    
    
    .loading-box {
    
        width: 280px;
    
        padding: 30px 20px;
    
        background: white;
    
        border-radius: 15px;
    
        text-align: center;
    
        box-shadow:
            0 5px 25px
            rgba(0, 0, 0, 0.3);
    
    }
    
    
    .loading-spinner {
    
        width: 45px;
    
        height: 45px;
    
        margin: 0 auto 20px;
    
        border:
            5px solid #e5e7eb;
    
        border-top-color:
            #007bff;
    
        border-radius: 50%;
    
        animation:
            loading-spin 0.8s linear infinite;
    
    }
    
    
    .loading-text {
    
        font-size: 18px;
    
        font-weight: bold;
    
        color: #333;
    
    }
    
    
    .loading-hint {
    
        margin-top: 10px;
    
        font-size: 14px;
    
        color: #888;
    
    }
    
    
    @keyframes loading-spin {
    
        from {
            transform: rotate(0deg);
        }
    
        to {
            transform: rotate(360deg);
        }
    
    }


    </style>

</head>

    <script>


        // =================================================
        // Google Apps Script 網址
        //
        // ⚠️ 一定要改成你的 /exec 網址
        // =================================================

        const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbz5A0b2thyY6D2ExzqC_IEizobQmFf6mxSHrw2rl7nWaBjsnjqOijuNf13rElb4aQPKUg/exec";



        // =================================================
        // 目前分頁
        // =================================================

        let currentMode =
            "single";



        // =================================================
        // DOM
        // =================================================

        const inputField =
            document.getElementById(
                "empIdInput"
            );


        const nameInput =
            document.getElementById(
                "nameInput"
            );

        const proxyEmpIdInput =
            document.getElementById(
                "proxyEmpIdInput"
            );


        const companySelect =
            document.getElementById(
                "companySelect"
            );


        const unitSelect =
            document.getElementById(
                "unit"
            );


        const status =
            document.getElementById(
                "statusMsg"
            );


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );

        // =================================================
        // 代報人工號檢查
        // =================================================
        
        proxyEmpIdInput.addEventListener(
            "input",
            function () {
        
                this.value =
                    this.value.toUpperCase();
        
            }
        );
        
        
        proxyEmpIdInput.addEventListener(
            "blur",
            function () {
        
                const empId =
                    inputField.value
                        .trim()
                        .toUpperCase();
        
                const proxyEmpId =
                    proxyEmpIdInput.value
                        .trim()
                        .toUpperCase();
        
                inputField.value =
                    empId;
        
                proxyEmpIdInput.value =
                    proxyEmpId;
        
        
                // ---------------------------------------------
                // 代報人工號等於報餐人工號
                // ---------------------------------------------
        
                if (
                    proxyEmpId !== "" &&
                    empId !== "" &&
                    proxyEmpId === empId
                ) {
        
                    status.style.color =
                        "#dc3545";
        

                    alert(
                        " ❌ 為自己報餐時，不需填寫此欄！"
                    );
        
                    proxyEmpIdInput.value = "";
        
                    proxyEmpIdInput.focus();
                
                        }
        
            }
        );




        // =================================================
        // localStorage
        // =================================================

        const STORAGE_KEY =
            "company_lunch_employee_id";


// =================================================
// 工號查詢員工資料
// =================================================

inputField.addEventListener(
    "blur",
    async function () {

        const empId =
            inputField.value
                .trim()
                .toUpperCase();


        inputField.value =
            empId;


        // =================================================
        // 沒有工號，不查詢
        // =================================================

        if (!empId) {

            return;

        }


        // =================================================
        // 顯示「正在查詢」視窗
        // =================================================

        const loadingOverlay =
            document.getElementById(
                "loadingOverlay"
            );

        const loadingText =
            document.getElementById(
                "loadingText"
            );


        loadingText.innerText =
            "正在查詢員工資料，請稍候...";


        loadingOverlay.style.display =
            "flex";


        // =================================================
        // 顯示狀態
        // =================================================

        status.style.color =
            "#666";

        status.innerHTML =
            "⏳ 正在查詢員工資料...";


        try {

            // =================================================
            // ⭐ 保留原本成功的 GET 查詢方式
            // =================================================

            const response =
                await fetch(
                    GOOGLE_SCRIPT_URL +
                    "?employeeId=" +
                    encodeURIComponent(
                        empId
                    )
                );


            const result =
                await response.json();


            console.log(
                "員工查詢結果：",
                result
            );


            // =================================================
            // 查詢完成
            // =================================================

            if (!result.success) {

                // ---------------------------------------------
                // 查詢失敗
                // ---------------------------------------------

                nameInput.value =
                    "";

                companySelect.value =
                    "";

                unitSelect.value =
                    "";


                // 清除代報人工號
                proxyEmpIdInput.value =
                    "";


                // 關閉查詢視窗
                loadingOverlay.style.display =
                    "none";


                status.style.color =
                    "#dc3545";

                status.innerHTML =
                    "❌ " +
                    (
                        result.message ||
                        "查無此員工工號"
                    );


                return;

            }


            // =================================================
            // 查詢成功
            // =================================================

            /*
             * 注意：
             * 你的 GAS 回傳格式是：
             *
             * result.employee.name
             * result.employee.company
             * result.employee.unit
             *
             * 不是：
             *
             * result.name
             */

            nameInput.value =
                result.employee?.name ||
                "";

            companySelect.value =
                result.employee?.company ||
                "";

            unitSelect.value =
                result.employee?.unit ||
                "";


            // =================================================
            // ⭐ 查詢完成後清除代報人工號
            // =================================================

            proxyEmpIdInput.value =
                "";


            // =================================================
            // ⭐ 工號不記錄
            // =================================================

            localStorage.removeItem(
                "company_lunch_employee_id"
            );

            // =================================================
            // 關閉查詢視窗
            // =================================================

            loadingOverlay.style.display =
                "none";


            // =================================================
            // 顯示成功
            // =================================================

            status.style.color =
                "#28a745";

            status.innerHTML =
                "✅ 員工資料查詢成功";


        }


        catch (error) {

            console.error(
                "查詢員工資料失敗：",
                error
            );


            // =================================================
            // 發生錯誤
            // =================================================

            proxyEmpIdInput.value =
                "";


            // 關閉查詢視窗
            loadingOverlay.style.display =
                "none";


            status.style.color =
                "#dc3545";

            status.innerHTML =
                "❌ 無法取得員工資料，請稍後再試。";

        }

    }
);




        // =================================================
        // 午餐 / 晚餐背景
        // =================================================

        const whiteInput =
            document.getElementById(
                "white"
            );

                    document.body.classList.remove(

                    );

                }

            }
        );



        // =================================================
        // 日期格式
        // =================================================

        function formatLocalDate(date) {

            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }



// =================================================
// 初始化日期
// 今天～未來30天
// =================================================

function initializeDates() {

    const today =
        new Date();


    // -------------------------------------------------
    // 開始日期：今天
    // -------------------------------------------------

    const startDate =
        new Date(
            today
        );


    // -------------------------------------------------
    // 結束日期：今天 + 30 天
    // -------------------------------------------------

    const endDate =
        new Date(
            today
        );

    endDate.setDate(
        endDate.getDate() + 30
    );


    const minStr =
        formatLocalDate(
            startDate
        );


    const maxStr =
        formatLocalDate(
            endDate
        );


    // =================================================
    // 單日報餐
    // =================================================

    const singleDateInput =
        document.getElementById(
            "single-date"
        );


    singleDateInput.min =
        minStr;


    singleDateInput.max =
        maxStr;


    // 預設選擇今天
    singleDateInput.value =
        minStr;



    // =================================================
    // 多日報餐
    // =================================================

    const multiContainer =
        document.getElementById(
            "multi-date-list"
        );


    multiContainer.innerHTML =
        "";


    let tempDate =
        new Date(
            startDate
        );


    while (
        tempDate <= endDate
    ) {


        const dateStr =
            formatLocalDate(
                tempDate
            );


        const weekDay =
            [
                "日",
                "一",
                "二",
                "三",
                "四",
                "五",
                "六"
            ][
                tempDate.getDay()
            ];


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "date-item";


        label.innerHTML = `

            <input
                type="checkbox"
                name="multi-dates"
                value="${dateStr}"
            >

            ${dateStr}
            (${weekDay})

        `;


        multiContainer.appendChild(
            label
        );


        // 下一天
        tempDate.setDate(
            tempDate.getDate() + 1
        );

    }

}






        // =================================================
        // 分頁
        // =================================================

        function switchTab(mode) {


            currentMode =
                mode;


            document
                .querySelectorAll(
                    ".tab-btn"
                )
                .forEach(
                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".tab-btn"
                )
                .forEach(
                    btn => {

                        if (
                            (
                                mode === "single" &&
                                btn.innerText.includes(
                                    "單日報餐"
                                )
                            )
                            ||
                            (
                                mode === "multi" &&
                                btn.innerText.includes(
                                    "多日報餐"
                                )
                            )
                        ) {

                            btn.classList.add(
                                "active"
                            );

                        }

                    }
                );


            document
                .querySelectorAll(
                    ".tab-content"
                )
                .forEach(
                    content => {

                        content.classList.remove(
                            "active"
                        );

                    }
                );


            const targetTab =
                document.getElementById(
                    "tab-" + mode
                );


            if (targetTab) {

                targetTab.classList.add(
                    "active"
                );

            }


            status.innerHTML =
                "";

        }



        // =================================================
        // 取得選擇日期
        // =================================================

        function getSelectedDates() {


            const dates = [];


            if (
                currentMode === "single"
            ) {


                const date =
                    document
                        .getElementById(
                            "single-date"
                        )
                        .value;


                if (date) {

                    dates.push(
                        date
                    );

                }

            }

            else {


                document
                    .querySelectorAll(
                        'input[name="multi-dates"]:checked'
                    )
                    .forEach(
                        checkbox => {

                            dates.push(
                                checkbox.value
                            );

                        }
                    );

            }


            return dates;

        }



        // =================================================
        // 報餐
        // =================================================

        window.submitOrder =
            async function () {


                // -------------------------------------------------
                // 檢查網址
                // -------------------------------------------------

                if (
                    !GOOGLE_SCRIPT_URL ||
                    GOOGLE_SCRIPT_URL.includes(
                        "請把你的"
                    )
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 尚未設定 Google Apps Script 網址。";

                    return;

                }



                // -------------------------------------------------
                // 取得資料
                // -------------------------------------------------

                const empId =
                    inputField.value
                        .trim()
                        .toUpperCase();


                const name =
                    nameInput.value
                        .trim();

                const proxyEmpId =
                    proxyEmpIdInput.value
                        .trim()
                        .toUpperCase();


                const company =
                    companySelect.value;


                const unit =
                    unitSelect.value;


                const mealTime =
                    document
                        .querySelector(
                            'input[name="mealTime"]:checked'
                        )
                        ?.value || "";


                const category =
                    document
                        .querySelector(
                            'input[name="category"]:checked'
                        )
                        ?.value || "";


                const selectedDates =
                    getSelectedDates();



                // -------------------------------------------------
                // 驗證
                // -------------------------------------------------

                if (!empId) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請先輸入您的員工代號！";

                    inputField.focus();

                    return;

                }


                if (!name) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請輸入您的姓名！";

                    nameInput.focus();

                    return;

                }


                if (!company) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請選擇公司！";

                    companySelect.focus();

                    return;

                }


                if (!unit) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請選擇單位！";

                    unitSelect.focus();

                    return;

                }


                if (
                    selectedDates.length === 0
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請至少選擇一個報餐日期！";

                    return;

                }



                // -------------------------------------------------
                // 禁止重複按鈕
                // -------------------------------------------------

                submitBtn.disabled =
                    true;


                submitBtn.innerText =
                    "⏳ 傳送中...";


                status.style.color =
                    "#666";


                status.innerHTML =
                    "⏳ 正在傳送報餐資料...";



                // -------------------------------------------------
                // 儲存資料
                // -------------------------------------------------

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        empId
                    );


                    localStorage.setItem(
                        NAME_STORAGE_KEY,
                        name
                    );


                    localStorage.setItem(
                        COMPANY_STORAGE_KEY,
                        company
                    );


                    localStorage.setItem(
                        UNIT_STORAGE_KEY,
                        unit
                    );

                }

                catch (error) {

                    console.error(
                        "儲存資料失敗：",
                        error
                    );

                }



                // =================================================
                // 開始逐日傳送
                // =================================================

                let successCount =
                    0;


                let failCount =
                    0;


                let resultMessages =
                    [];



                try {


                    for (
                        const orderDate
                        of selectedDates
                    ) {


                        const data = {

                            orderDate:
                                orderDate,

                            mealTime:
                                mealTime,

                            category:
                                category,

                            employeeId:
                                empId,

                            name:
                                name,

                            company:
                                company,

                            unit:
                                unit,
                        
                            proxyEmployeeId:
                                proxyEmpId

                        };


                        console.log(
                            "傳送資料：",
                            data
                        );



                        try {


                            const response =
                                await fetch(
                                    GOOGLE_SCRIPT_URL,
                                    {

                                        method:
                                            "POST",

                                        headers: {

                                            "Content-Type":
                                                "text/plain;charset=utf-8"

                                        },

                                        body:
                                            JSON.stringify(
                                                data
                                            )

                                    }
                                );



                            // -------------------------------------------------
                            // Google 回應
                            // -------------------------------------------------

                            const result =
                                await response.json();


                            console.log(
                                "Google 回應：",
                                result
                            );



                            // -------------------------------------------------
                            // 成功
                            // -------------------------------------------------

                            if (
                                result.success
                            ) {


                                successCount++;


                                resultMessages.push(`

                                    <div class="result-success">

                                        ✅ ${orderDate}
                                        報餐成功

                                    </div>

                                `);

                            }



                            // -------------------------------------------------
                            // 失敗
                            // -------------------------------------------------

                            else {


                                failCount++;


                                resultMessages.push(`

                                    <div class="result-fail">

                                        ❌ ${orderDate}
                                        報餐失敗：
                                        ${
                                            result.message ||
                                            "未知錯誤"
                                        }

                                    </div>

                                `);

                            }


                        }


                        catch (error) {


                            console.error(
                                `${orderDate} 傳送失敗：`,
                                error
                            );


                            failCount++;


                            resultMessages.push(`

                                <div class="result-fail">

                                    ❌ ${orderDate}
                                    報餐失敗：
                                    無法連線到 Google

                                </div>

                            `);

                        }

                    }



                    // =================================================
                    // 顯示最後結果
                    // =================================================

                    if (
                        failCount === 0
                    ) {

                        status.style.color =
                            "#28a745";

                    }

                    else if (
                        successCount > 0
                    ) {

                        status.style.color =
                            "#ff9800";

                    }

                    else {

                        status.style.color =
                            "#dc3545";

                    }



                    status.innerHTML = `

                        <div class="status-title">

                            🎉 報餐處理完成

                        </div>


                        <div style="
                            text-align:center;
                            margin-bottom:12px;
                        ">

                            成功
                            ${successCount}
                            天　
                            失敗
                            ${failCount}
                            天

                        </div>


                        ${resultMessages.join("")}

                    `;


                }


                catch (error) {


                    console.error(
                        "報餐系統錯誤：",
                        error
                    );


                    status.style.color =
                        "#dc3545";


                    status.innerHTML =
                        "❌ 報餐處理失敗，請稍後再試。";

                }



                // -------------------------------------------------
                // 恢復按鈕
                // -------------------------------------------------

                finally {

                    submitBtn.disabled =
                        false;


                    submitBtn.innerText =
                        "🙋‍♂️ 我要報餐";

                }

            };



        // =================================================
        // Service Worker
        // =================================================

        if (
            "serviceWorker" in navigator
        ) {


            navigator.serviceWorker
                .register(
                    "/sw.js"
                )
                .catch(
                    err => {

                        console.log(
                            "Service Worker 註冊失敗：",
                            err
                        );

                    }
                );

        }



        // =================================================
        // 網頁載入
        // =================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                initializeDates();

            }
        );


    </script>


</body>

</html>
