<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>員工團膳報餐系統</title>


    <!-- =====================================================
         PWA
    ====================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

            text-align: center;

            padding: 20px;

            color: #333;

            transition:
                background 0.3s ease;

        }


        /* -------------------------------------------------
           卡片
        ------------------------------------------------- */

        .card {

            background: white;

            max-width: 400px;

            margin: 30px auto;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.1);

        }


        h2 {

            color: #007bff;

            margin-bottom: 20px;

        }


        /* -------------------------------------------------
           輸入區
        ------------------------------------------------- */

        .input-group {

            margin: 20px 0;

            text-align: left;

        }
        
        .input-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 16px;

            color: #555;

        }


        .input-field {

            display: block;

            width: 100%;

            padding: 12px;

            font-size: 18px;

            border:
                2px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

        }

        .proxy-input-field{

            display: block;

            width: 100%;

            padding: 12px;

            font-size: 18px;

            border:
                2px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

            background-color: #fff8e1;

        }


        .input-field:focus {

            border-color: #007bff;

            outline: none;

        }


        /* -------------------------------------------------
           按鈕
        ------------------------------------------------- */

        .btn {

            display: block;

            width: 100%;

            padding: 15px;

            margin: 15px 0;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;

            font-weight: bold;

        }


        .btn-lunch {

            background-color: #28a745;

            color: white;

        }


        .btn-lunch:hover {

            background-color: #218838;

        }


        .btn:disabled {

            background-color: #999;

            cursor: not-allowed;

        }


        /* -------------------------------------------------
           狀態訊息
        ------------------------------------------------- */

        .status {

            margin-top: 20px;

            font-weight: bold;

            font-size: 16px;

            line-height: 1.8;

            min-height: 24px;

            text-align: left;

            word-break: break-word;

        }


        .status-title {

            text-align: center;

            font-size: 18px;

            margin-bottom: 10px;

        }


        .result-success {

            color: #28a745;

        }


        .result-fail {

            color: #dc3545;

        }


        .hint {

            font-size: 12px;

            color: #888;

            text-align: center;

            margin-top: 5px;

        }


        /* -------------------------------------------------
           午餐 / 晚餐
        ------------------------------------------------- */

        .meal-options {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .meal-option {

            flex: 1;

            cursor: pointer;

        }


        .meal-option input {

            display: none;

        }


        .meal-option span {

            display: block;

            padding: 14px 10px;

            text-align: center;

            border:
                2px solid #ccc;

            border-radius: 8px;

            background-color: #fff;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;

        }


        .meal-option input:checked + span {

            background-color: #007bff;

            color: white;

            border-color: #007bff;

        }


        /* -------------------------------------------------
           分頁
        ------------------------------------------------- */

        .tabs {

            display: flex;

            justify-content: space-around;

            margin-bottom: 20px;

            border-bottom:
                2px solid #ddd;

        }


        .tab-btn {

            background: none;

            border: none;

            padding: 10px 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: #666;

            border-bottom:
                3px solid transparent;

            transition: 0.2s;

        }


        .tab-btn.active {

            color: #007bff;

            border-bottom-color:
                #007bff;

        }


        .tab-content {

            display: none;

        }


        .tab-content.active {

            display: block;

        }


        /* -------------------------------------------------
           多日日期
        ------------------------------------------------- */

        .date-checkbox-list {

            display: grid;

            grid-template-columns:
                repeat(1, 1fr);

            gap: 10px;

            max-height: 250px;

            overflow-y: auto;

            border:
                2px solid #ccc;

            border-radius: 8px;

            padding: 10px;

            background: #fafafa;

        }


        .date-item {

            display: flex;

            align-items: center;

            padding: 8px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 6px;

            cursor: pointer;

        }


        .date-item:hover {

            background: #f0f8ff;

        }


        .date-item input {

            margin-right: 8px;

            transform: scale(1.2);

        }


        /* -------------------------------------------------
           午餐背景
        ------------------------------------------------- */

        body.white-mode {

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

        }


        /* -------------------------------------------------
           晚餐背景
        ------------------------------------------------- */

        body.dark-mode {

            background:
                linear-gradient(
                    135deg,
                    #0F172A 0%,
                    #1E1B4B 100%
                );

        }


        body.dark-mode .card {

            background: #f8fafc;

        }

    /* =================================================
       員工資料查詢視窗
    ================================================= */
    
    .loading-overlay {
    
        display: none;
    
        position: fixed;
    
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    
        background: rgba(0, 0, 0, 0.55);
    
        z-index: 99999;
    
        justify-content: center;
    
        align-items: center;
    
    }
    
    
    .loading-box {
    
        width: 280px;
    
        padding: 30px 20px;
    
        background: white;
    
        border-radius: 15px;
    
        text-align: center;
    
        box-shadow:
            0 5px 25px
            rgba(0, 0, 0, 0.3);
    
    }
    
    
    .loading-spinner {
    
        width: 45px;
    
        height: 45px;
    
        margin: 0 auto 20px;
    
        border:
            5px solid #e5e7eb;
    
        border-top-color:
            #007bff;
    
        border-radius: 50%;
    
        animation:
            loading-spin 0.8s linear infinite;
    
    }
    
    
    .loading-text {
    
        font-size: 18px;
    
        font-weight: bold;
    
        color: #333;
    
    }
    
    
    .loading-hint {
    
        margin-top: 10px;
    
        font-size: 14px;
    
        color: #888;
    
    }
    
    
    @keyframes loading-spin {
    
        from {
            transform: rotate(0deg);
        }
    
        to {
            transform: rotate(360deg);
        }
    
    }

    /* -------------------------------------------------
       系統自動帶入欄位
    ------------------------------------------------- */
    
    .auto-field {
    
        display: block;
    
        width: 100%;
    
        padding: 12px;
    
        font-size: 18px;
    
        border:
            2px solid #bfdbfe;
    
        border-radius: 8px;
    
        box-sizing: border-box;
    
        text-align: center;
    
        background-color: #eff6ff;
    
        color: #374151;
    
        font-weight: bold;
    
        cursor: not-allowed;
    
    }

        /* -------------------------------------------------
           單日報餐時間資訊
        ------------------------------------------------- */

        .single-time-info {
        
            margin-top: 12px;
        
            padding: 14px;
        
            background-color: #f8fafc;
        
            border:
                1px solid #dbeafe;
        
            border-radius: 8px;
        
            text-align: center;
        
        }
        
        
        /* 目前時間 */
        
        .current-time {
        
            font-size: 18px;
        
            font-weight: bold;
        
            color: #2563eb;
        
            margin-bottom: 10px;
        
        }
        
        
        /* 報餐規則 */
        
        .meal-rule {
        
            font-size: 14px;
        
            color: #555;
        
            line-height: 1.8;
        
        }

        /* =================================================
           系統第一層頁面
        ================================================= */
        
        .system-page {
            display: none;
        }
        
        .system-page.active {
            display: block;
        }

        /* =================================================
           系統第一層主導覽
        ================================================= */
        
        .system-nav {
        
            max-width: 400px;
        
            margin: 0 auto 20px auto;
        
            display: grid;
        
            grid-template-columns:
                repeat(4, 1fr);
        
            gap: 8px;
        
            background: white;
        
            padding: 8px;
        
            border-radius: 12px;
        
            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.08);
        
        }
        
        
        .system-nav-btn {
        
            border: none;
        
            background: transparent;
        
            padding: 12px 6px;
        
            border-radius: 8px;
        
            cursor: pointer;
        
            font-size: 15px;
        
            font-weight: bold;
        
            color: #666;
        
            transition: 0.2s;
        
        }
        
        
        .system-nav-btn span {
        
            display: block;
        
            margin-top: 4px;
        
        }
        
        
        .system-nav-btn:hover {
        
            background: #f0f8ff;
        
            color: #007bff;
        
        }
        
        
        .system-nav-btn.active {
        
            background: #007bff;
        
            color: white;
        
        }
        
        
        /* -------------------------------------------------
           手機版
        ------------------------------------------------- */
        
        @media (max-width: 500px) {
        
            .system-nav-btn {
        
                font-size: 13px;
        
                padding: 10px 3px;
        
            }
        
        }

        /* =================================================
           查詢日期區間
           手機版防止日期欄位突出
        ================================================= */
        
        #page-query input[type="date"] {
            min-width: 0;
            width: 100%;
        }
        
        #page-query .input-group > div[style*="display:flex"] {
            width: 100%;
            box-sizing: border-box;
        }
        
        @media (max-width: 600px) {
        
            #page-query .input-group > div[style*="display:flex"] {
                gap: 6px !important;
            }
        
            #page-query input[type="date"] {
                min-width: 0;
                width: 0;
                flex: 1 1 0;
                box-sizing: border-box;
        
                /* 手機版日期文字縮小 */
                font-size: 15px;
                padding: 10px 6px;
            }
        
        }

        /* =================================================
           查詢結果表格
        ================================================= */
        
        .query-result {
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
        }
        
        .query-table-wrapper {
        
            width: 100%;
        
            overflow-x: auto;
        
            margin-top: 20px;
        
            border:
                1px solid #ddd;
        
            border-radius: 10px;
        
            background: white;
        
        }
        
        
        .query-table {
        
            width: 100%;
        
            min-width: 1050px;
        
            border-collapse: collapse;
        
            font-size: 14px;
        
        }
        
        
        .query-table th {
        
            background: #007bff;
        
            color: white;
        
            padding: 12px 10px;
        
            border:
                1px solid #ddd;
        
            white-space: nowrap;
        
            text-align: center;
        
        }
        
        
        .query-table td {
        
            padding: 11px 10px;
        
            border:
                1px solid #ddd;
        
            white-space: nowrap;
        
            text-align: center;
        
        }
        
        
        .query-table tbody tr:nth-child(even) {
        
            background:
                #f8fafc;
        
        }
        
        
        .query-table tbody tr:hover {
        
            background:
                #eff6ff;
        
        }
        
        
        /* =================================================
           電腦版
        ================================================= */
        
        @media (min-width: 769px) {
        
            .query-result {
        
                width: 100%;
        
                max-width: 1400px;
        
                padding:
                    0 20px;
        
                box-sizing: border-box;
        
            }
        
        }
        
        
        /* =================================================
           手機版
        ================================================= */
        
        @media (max-width: 768px) {
        
            .query-result {
        
                width: 100%;
        
                padding:
                    0 10px;
        
                box-sizing: border-box;
        
            }
        
            .query-table-wrapper {
        
                border-radius: 8px;
        
            }
        
            .query-table {
        
                min-width: 1050px;
        
                font-size: 13px;
        
            }
        
        }

        
        
        /* =========================================
           可取消按鈕
        ========================================= */
        
        .cancel-order-btn {
        
            background: #dc3545;
        
            color: #ffffff;
        
            border: none;
        
            border-radius: 8px;
        
            padding: 7px 14px;
        
            font-size: 14px;
        
            font-weight: 600;
        
            cursor: pointer;
        
            transition: all 0.2s ease;
        
        }
        
        
        /* 滑過去 */
        
        .cancel-order-btn:hover {
        
            background: #c82333;
        
            transform: translateY(-1px);
        
        }
        
        
        /* 按下去 */
        
        .cancel-order-btn:active {
        
            background: #a71d2a;
        
            transform: translateY(0);
        
        }
        
        
        /* =========================================
           不可取消
        ========================================= */
        
        .status-disabled {
        
            color: #888888;
        
            background: #eeeeee;
        
            border-radius: 8px;
        
            padding: 7px 14px;
        
            font-size: 14px;
        
            cursor: not-allowed;
        
            display: inline-block;
        
        }

        /* =================================================
           查詢頁面：授權公司鎖定欄位
        ================================================= */
        
        .query-company-locked {
            background-color: #eff6ff !important;
            border-color: #bfdbfe !important;
            color: #374151;
            font-weight: bold;
            cursor: not-allowed !important;
        }
        
        .query-company-locked:hover {
            cursor: not-allowed !important;
        }


    </style>

</head>


<body>

     <!-- =================================================
         系統第一層主導覽
    ================================================== -->

    <nav class="system-nav">

        <button
            type="button"
            class="system-nav-btn active"
            onclick="switchSystemPage('order')"
            data-page="order"
        >
            🙋
            <span>報餐</span>
        </button>

        <button
            type="button"
            class="system-nav-btn"
            onclick="switchSystemPage('query')"
            data-page="query"
        >
            🔎
            <span>查詢／統計</span>
        </button>

        <button
            type="button"
            class="system-nav-btn"
            onclick="switchSystemPage('meal-stat')"
            data-page="meal-stat"
        >
            🍱
            <span>餐點統計</span>
        </button>

        <button
            type="button"
            class="system-nav-btn"
            onclick="switchSystemPage('menu')"
            data-page="menu"
        >
            📖
            <span>菜單</span>
        </button>

    </nav>


    <!-- =================================================
         系統頁面
    ================================================== -->

    <main class="system-pages">

        <section
            id="page-order"
            class="system-page active"
        >    

    <!-- =================================================
         員工資料查詢視窗
    ================================================== -->
    
    <div
        id="loadingOverlay"
        class="loading-overlay"
    >
    
        <div class="loading-box">
    
            <div class="loading-spinner"></div>
    
            <div
                id="loadingText"
                class="loading-text"
            >
                正在查詢員工資料...
            </div>
    
            <div class="loading-hint">
                請稍候，查詢完成後會自動關閉
            </div>
    
        </div>
    
    </div>
               
            <div class="card">
    
    
            <h2>
                員工團膳報餐系統
            </h2>
    
    
    <!-- =================================================
         員工工號
    ================================================== -->
    
    <div class="input-group">
    
        <label for="empIdInput">
    
            🆔 員工工號
            (運務士為xxxxx，沒有D)：
    
        </label>
    
        <input
            type="text"
            id="empIdInput"
            class="input-field"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="請輸入員工代號"
        >
    
        <div class="hint">
    
            ※ 輸入工號後，姓名、公司、單位會自動帶入。
    
        </div>
    
    </div>
    
    
    <!-- =================================================
         員工姓名
    ================================================== -->
    
    <div class="input-group">
    
        <label for="nameInput">
    
            👤 姓名：
    
        </label>
    
        <input
            type="text"
            id="nameInput"
            class="auto-field"
            readonly
            placeholder="輸入工號後自動帶入"
        >
    
    </div>
    
    
        <!-- =================================================
             公司
        ================================================== -->
        
        <div class="input-group">
        
            <label for="companySelect">
                🏢 公司名稱：
            </label>
        
            <input
                type="text"
                id="companySelect"
                class="auto-field"
                readonly
                placeholder="輸入工號後自動帶入"
            >
        
        </div>
    
    
            <!-- =================================================
                 單位
            ================================================== -->
            
            <div class="input-group">
            
                <label for="unit">
                    👨‍👩‍👧‍👦 單位組別：
                </label>
            
                <input
                    type="text"
                    id="unit"
                    class="auto-field"
                    readonly
                    placeholder="輸入工號後自動帶入"
                >
            
            </div>
    
        <!-- =================================================
             代報人工號
        ================================================== -->
        
        <div class="input-group">
        
            <label for="proxyEmpIdInput">
        
                ✍️ 代報人工號：
        
            </label>
        
            <input
                type="text"
                id="proxyEmpIdInput"
                class="input-field"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="若為本人報餐請留白"
            >
        
            <div class="hint">
        
                ※ 若由其他人代為報餐，請輸入代報人工號。
                本人報餐不需填寫。
        
            </div>
        
        </div>
    
            <!-- =================================================
                 用餐時段
            ================================================== -->
    
            <div class="input-group">
    
                <label>
                    用餐時段：
                </label>
    
    
                <div class="meal-options">
    
    
                    <label class="meal-option">
    
                        <input
                            type="radio"
                            name="mealTime"
                            value="午餐"
                            checked
                            id="white"
                        >
    
                        <span>
                            ☀️ 午餐
                        </span>
    
                    </label>
    
    
                    <label class="meal-option">
    
                        <input
                            type="radio"
                            name="mealTime"
                            value="晚餐"
                            id="black"
                        >
    
                        <span>
                            🌙 晚餐
                        </span>
    
                    </label>
    
    
                </div>
    
            </div>
    
    
            <!-- =================================================
                 葷素
            ================================================== -->
    
            <div class="input-group">
    
                <label>
                    訂餐類別：
                </label>
    
    
                <div class="meal-options">
    
    
                    <label class="meal-option">
    
                        <input
                            type="radio"
                            name="category"
                            value="葷食"
                            checked
                        >
    
                        <span>
                            🥩 葷食
                        </span>
    
                    </label>
    
    
                    <label class="meal-option">
    
                        <input
                            type="radio"
                            name="category"
                            value="素食"
                        >
    
                        <span>
                            🥬 素食
                        </span>
    
                    </label>
    
    
                </div>
    
            </div>
    
            <div
                id="single-time-info"
                class="single-time-info"
            >
            
                <div
                    id="current-time"
                    class="current-time"
                >
                    🕐 目前時間：讀取中...
                </div>
            
            
                <div class="meal-rule">
            
                     午餐：當天報餐截止時間為
                    <strong>09:00</strong>
            
                </div>
            
            
                <div class="meal-rule">
            
                    晚餐：當天報餐截止時間為
                    <strong>14:00</strong>
            
                </div>
            
            </div>
    
    
            <!-- =================================================
                 分頁
            ================================================== -->
    
            <div class="tabs">
    
    
                <button
                    class="tab-btn active"
                    onclick="switchTab('single')"
                    type="button"
                >
    
                    📅 單日報餐
    
                </button>
    
    
                <button
                    class="tab-btn"
                    onclick="switchTab('multi')"
                    type="button"
                >
    
                    🗂️ 多日報餐
    
                </button>
    
    
            </div>
    
    
            <!-- =================================================
                 單日報餐
            ================================================== -->
    
            <div
                id="tab-single"
                class="tab-content active"
            >
    
    
                <div class="input-group">
    
                    <label for="single-date">
    
                        選擇報餐日期 (單選)
    
                    </label>
    
    
                    <input
                        type="date"
                        id="single-date"
                        class="input-field"
                    >
    
                </div>
    
    
            </div>
    
    
            <!-- =================================================
                 多日報餐
            ================================================== -->
    
            <div
                id="tab-multi"
                class="tab-content"
            >
    
    
                <div class="input-group">
    
                    <label>
    
                        選擇報餐日期 (可多選)
    
                    </label>

        async function initializeQueryCompanyAuth() {
        
            const queryCompany =
                document.getElementById("queryCompany");
        
            if (!queryCompany) return;
        
        
            // 取得網址帳號
            const pathname =
                window.location.pathname;
        
            const search =
                window.location.search;
        
            let account = "";
        
            if (
                pathname.startsWith("/wuci-lunch/")
            ) {
        
                account =
                    pathname
                        .substring("/wuci-lunch/".length)
                        .split("/")[0]
                        .trim();
        
            }
        
            if (
                !account &&
                search &&
                search !== "?"
            ) {
        
                const q =
                    search.substring(1).trim();
        
                account =
                    q.startsWith("account=")
                        ? decodeURIComponent(q.substring(8))
                        : (
                            !q.includes("=") &&
                            !q.includes("&")
                                ? decodeURIComponent(q)
                                : ""
                        );
        
            }
        
        
            if (!account) return;
        
        
            // 先讀取快取
            const cacheKey =
                "query_company_" + account;
        
            const cached =
                localStorage.getItem(cacheKey);
        
            if (cached) {
                queryCompany.value = cached;
            }
        
        
            // 背景向 GAS 認證
            try {
        
                const response =
                    await fetch(
                        GOOGLE_SCRIPT_URL +
                        "?action=checkQueryAuth" +
                        "&account=" +
                        encodeURIComponent(account)
                    );
        
                const result =
                    await response.json();
        
        
                if (
                    result.success &&
                    result.company
                ) {
        
                    queryCompany.value =
                        result.company;
        
                    localStorage.setItem(
                        cacheKey,
                        result.company
                    );
        
                }
        
            }
            catch (error) {
        
                console.error(
                    "授權查詢失敗：",
                    error
                );
        
            }
        
        }

        // =================================================

        // =================================================

        function formatLocalDate(date) {

            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }

        // =================================================
        // 報餐時間設定
        // =================================================
        
        const LUNCH_DEADLINE_HOUR = 9;
        
        const DINNER_DEADLINE_HOUR = 14;
        
        
        // =================================================
        // 取得目前台灣時間
        // =================================================
        
        function getTaiwanNow() {
        
            const now =
                new Date();
        
            const taiwanString =
                now.toLocaleString(
                    "en-US",
                    {
                        timeZone:
                            "Asia/Taipei"
                    }
                );
        
            return new Date(
                taiwanString
            );
        
        }

        function updateCurrentTime() {
        
            const timeElement =
                document.getElementById(

            if (!timeElement) {
        
                return;
        
            }
        
        
            const now =
                getTaiwanNow();
        
        
            const year =
                now.getFullYear();
        
        
            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );
        
        
            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );
        
        
            const hours =
                String(
                    now.getHours()
                ).padStart(
                    2,
                    "0"
                );
        
        
            const minutes =
                String(
                    now.getMinutes()
                ).padStart(
                    2,
                    "0"
                );
        
        
            const seconds =
                String(
                    now.getSeconds()
                ).padStart(
                    2,
                    "0"
                );
        
        
            timeElement.innerText =
                `🕐 目前時間：${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

        // =================================================

        function checkSingleMealTime() {
        
            const dateInput =
                document.getElementById(
                    "single-date"
                );
        
        
            if (!dateInput) {
        
                return true;
        
            }
        
        
            const selectedDate =
                dateInput.value;
        
        
            // -------------------------------------------------
            // 沒選日期
            // -------------------------------------------------
        
            if (!selectedDate) {
        
                return true;
        
            }
        
        
            const now =
                getTaiwanNow();
        
        
            const today =
                formatLocalDate(
                    now
                );
        
        
            // -------------------------------------------------
            // 未來日期
            //
            // 不受當天截止時間限制
            // -------------------------------------------------
        
            if (
                selectedDate !== today
            ) {
                
                return true;
        
            }
        
        
            // -------------------------------------------------
            // 取得目前餐別
            // -------------------------------------------------
        
            const mealTime =
                document.querySelector(
                    'input[name="mealTime"]:checked'
                )?.value || "";
        
        
            const currentHour =
                now.getHours();
        
        
            const currentMinute =
                now.getMinutes();
        
        
            const currentTime =
                currentHour * 60 +
                currentMinute;
        
        
            // -------------------------------------------------
            // 午餐
            // 截止 09:00
            // -------------------------------------------------
        
            if (
                mealTime === "午餐"
            ) {
        
                const deadline =
                    LUNCH_DEADLINE_HOUR * 60;
        
        
                if (
                    currentTime >= deadline
                ) {
        
                    return false;
        
                }
        
            }
        
        
            // -------------------------------------------------
            // 晚餐
            // 截止 14:00
            // -------------------------------------------------
        
            if (
                mealTime === "晚餐"
            ) {
        
                const deadline =
                    DINNER_DEADLINE_HOUR * 60;
        
        
                if (
                    currentTime >= deadline
                ) {
        
                    return false;
        
                }
        
            }
        
        
            // -------------------------------------------------
            // 可以報餐
            // -------------------------------------------------
        
        
            return true;
        
        }
        

// =================================================
// 初始化日期

function initializeDates() {

    const today =
        new Date();


    // -------------------------------------------------
    // 開始日期：今天
    // -------------------------------------------------

    const startDate =
        new Date(
            today
        );


    // -------------------------------------------------
    // 結束日期：今天 + 30 天
    // -------------------------------------------------

    const endDate =
        new Date(
            today
        );

    endDate.setDate(
        endDate.getDate() + 30
    );


    const minStr =
        formatLocalDate(
            startDate
        );


    const maxStr =
        formatLocalDate(
            endDate
        );


    // =================================================
    // 單日報餐
    // =================================================

    singleDateInput.addEventListener(
        "change",
        function () {
    
            const selectedDate =
                this.value;
    
            const today =
                formatLocalDate(
                    new Date()
                );
    
            const maxDate =
                new Date();
    
            maxDate.setDate(
                maxDate.getDate() + 30
            );
    
            const maxDateStr =
                formatLocalDate(
                    maxDate
                );
    
    
            // -----------------------------------------
            // 選到今天以前
            // -----------------------------------------
    
            if (
                selectedDate < today
            ) {
    
                alert(
                    "❌ 報餐日期不能選擇今天以前的日期！"
                );
    
                this.value =
                    today;
    
                return;
    
            }
    
    
            // -----------------------------------------
            // 超過未來 30 天
            // -----------------------------------------
    
            if (
                selectedDate > maxDateStr
            ) {
    
                alert(
                    "❌ 報餐日期最多只能選擇今天起 30 天內！"
                );
    
                this.value =
                    maxDateStr;
    
                return;
    
            }
    
        }
    );

    singleDateInput.min =
        minStr;


    singleDateInput.max =
        maxStr;


    // 預設選擇今天
    singleDateInput.value =
        minStr;



    // =================================================
    // 多日報餐
    // =================================================

    const multiContainer =
        document.getElementById(
            "multi-date-list"
        );


    multiContainer.innerHTML =
        "";


    let tempDate =
        new Date(
            startDate
        );


    while (
        tempDate <= endDate
    ) {


        const dateStr =
            formatLocalDate(
                tempDate
            );


        const weekDay =
            [
                "日",
                "一",
                "二",
                "三",
                "四",
                "五",
                "六"
            ][
                tempDate.getDay()
            ];


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "date-item";


        label.innerHTML = `

            <input
                type="checkbox"
                name="multi-dates"
                value="${dateStr}"
            >

            ${dateStr}
            (${weekDay})

        `;


        multiContainer.appendChild(
            label
        );


        // 下一天
        tempDate.setDate(
            tempDate.getDate() + 1
        );

    }
    
        // =================================================
        // 查詢／統計日期限制
        // 今天～未來30天
        // =================================================
    
        const queryStartDate =
            document.getElementById(
                "queryStartDate"
            );
    
        const queryEndDate =
            document.getElementById(
                "queryEndDate"
            );
    
    
        if (
            queryStartDate &&
            queryEndDate
        ) {
    
            queryStartDate.min =
                minStr;
    
            queryStartDate.max =
                maxStr;
    
            queryEndDate.min =
                minStr;
    
            queryEndDate.max =
                maxStr;
    
            queryStartDate.value =
                minStr;
    
            queryEndDate.value =
                maxStr;
    
        }

}

                                btn.innerText.includes(
                                    "單日報餐"
                                )
                            )
                            ||
                            (
                                mode === "multi" &&
                                btn.innerText.includes(
                                    "多日報餐"
                                )
                            )
                        ) {

                            btn.classList.add(
                                "active"
                            );

                        }

                    }
                );


            document
                .querySelectorAll(
                    ".tab-content"
                )
                .forEach(
                    content => {

                        content.classList.remove(
                            "active"
                        );

                    }
                );


            const targetTab =
                document.getElementById(
                    "tab-" + mode
                );


            if (targetTab) {

                targetTab.classList.add(
                    "active"
                );

            }


            status.innerHTML =
                "";

                        )
                        .value;

                }

                            );

        // =================================================
        // 報餐
        // =================================================

        window.submitOrder =
            async function () {


                // -------------------------------------------------
                // 檢查網址
                // -------------------------------------------------

                if (
                    !GOOGLE_SCRIPT_URL ||
                    GOOGLE_SCRIPT_URL.includes(
                        "請把你的"
                    )
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 尚未設定 Google Apps Script 網址。";

                    return;

                }



                // -------------------------------------------------
                // 取得資料
                // -------------------------------------------------

                const empId =
                    inputField.value
                        .trim()
                        .toUpperCase();


                const name =
                    nameInput.value
                        .trim();

                const proxyEmpId =
                    proxyEmpIdInput.value
                        .trim()
                        .toUpperCase();


                const company =
                    companySelect.value;


                const unit =
                    unitSelect.value;


                const mealTime =
                    document
                        .querySelector(
                            'input[name="mealTime"]:checked'
                        )
                        ?.value || "";


                const category =
                    document
                        .querySelector(
                            'input[name="category"]:checked'
                        )
                        ?.value || "";


                const selectedDates =
                    getSelectedDates();

        // -------------------------------------------------
        // 檢查當天報餐截止時間
        // -------------------------------------------------
        
        const now =
            getTaiwanNow();
        
        const today =
            formatLocalDate(now);
        
        const currentTime =
            now.getHours() * 60 +
            now.getMinutes();
        
        
        // =================================================
        // 過濾已經超過截止時間的「今天」
        // 未來日期不受影響
        // =================================================
        
        const validDates =
            selectedDates.filter(
                orderDate => {
        
                    // -----------------------------------------
                    // 未來日期
                    // 直接保留
                    // -----------------------------------------
        
                    if (
                        orderDate !== today
                    ) {
        
                        return true;
        
                    }
        
        
                    // -----------------------------------------
                    // 今天 + 午餐
                    // -----------------------------------------
        
                    if (
                        mealTime === "午餐" &&
                        currentTime >= 9 * 60
                    ) {
        
                        return false;
        
                    }
        
        
                    // -----------------------------------------
                    // 今天 + 晚餐
                    // -----------------------------------------
        
                    if (
                        mealTime === "晚餐" &&
                        currentTime >= 14 * 60
                    ) {
        
                        return false;
        
                    }
        
        
                    // -----------------------------------------
                    // 今天尚未超過截止時間
                    // -----------------------------------------
        
                    return true;
        
                }
            );
        
        
        // =================================================
        // 如果所有日期都不能報餐
        // =================================================
        
        if (
            validDates.length === 0
        ) {
        
            status.style.color =
                "#dc3545";
        
            if (
                mealTime === "午餐"
            ) {
        
                status.innerHTML =
                    "❌ 今日午餐已超過 09:00 截止時間，無法報餐。";
        
            }
            else {
        
                status.innerHTML =
                    "❌ 今日晚餐已超過 14:00 截止時間，無法報餐。";
        
            }
        
            return;
        
        }
        
        
        // =================================================
        // 如果有部分日期被排除
        // =================================================
        
        if (
            validDates.length <
            selectedDates.length
        ) {
        
            status.style.color =
                "#ff9800";
        
        }


                // -------------------------------------------------
                // 驗證
                // -------------------------------------------------

                if (!empId) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請先輸入您的員工代號！";

                    inputField.focus();

                    return;

                }


                if (!name) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請輸入您的姓名！";

                    nameInput.focus();

                    return;

                }


                if (!company) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請選擇公司！";

                    companySelect.focus();

                    return;

                }


                if (!unit) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請選擇單位！";

                    unitSelect.focus();

                    return;

                }


                if (
                    selectedDates.length === 0
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerHTML =
                        "❌ 請至少選擇一個報餐日期！";

                    return;

                }



                // -------------------------------------------------
                // 禁止重複按鈕
                // -------------------------------------------------

                submitBtn.disabled =
                    true;


                submitBtn.innerText =
                    "⏳ 傳送中...";


                status.style.color =
                    "#666";


                status.innerHTML =
                    "⏳ 正在傳送報餐資料...";

                // =================================================
                // 一次傳送全部日期
                // =================================================

                let successCount =
                    0;


                let failCount =
                    0;


                let resultMessages =
                    [];

                try {
                
                    const data = {
                
                        dates:
                            validDates,
                
                        mealTime:
                            mealTime,
                
                        category:
                            category,
                
                        employeeId:
                            empId,
                
                        name:
                            name,
                
                        company:
                            company,
                
                        unit:
                            unit,
                
                        proxyEmployeeId:
                            proxyEmpId
                
                    };
                
                
                    console.log(
                        "一次傳送報餐資料：",
                        data
                    );
                
                
                    const response =
                        await fetch(
                            GOOGLE_SCRIPT_URL,
                            {
                
                                method:
                                    "POST",
                
                                headers: {
                
                                    "Content-Type":
                                        "text/plain;charset=utf-8"
                
                                },
                
                                body:
                                    JSON.stringify(data)
                
                            }
                        );
                
                
                    const result =
                        await response.json();
                
                
                    console.log(
                        "Google 回應：",
                        result
                    );             

                // =================================================
                // 處理 GAS 回傳的每一天結果
                // =================================================
                
                if (
                    Array.isArray(result.results)
                ) {
                
                    result.results.forEach(
                        item => {
                
                            if (
                                item.success
                            ) {
                
                                resultMessages.push(`
                
                                    <div class="result-success">
                
                                        ✅ ${item.date}
                                        報餐成功
                
                                    </div>
                
                                `);
                
                            }
                
                            else {
                
                                resultMessages.push(`
                
                                    <div class="result-fail">
                
                                        ❌ ${item.date}
                                        報餐失敗：
                                        ${
                                            item.message ||
                                            "未知錯誤"
                                        }
                
                                    </div>
                
                                `);
                
                            }
                
                        }
                    );
                
                }
                
                
                // =================================================
                // 今天是否因截止時間被跳過
                // =================================================
                //
                // selectedDates = 使用者原本選的日期
                //
                // validDates = 實際送給 GAS 的日期
                //
                // 如果今天原本有選，但被 validDates 排除
                // 就代表今天因為超過截止時間而失敗
                //
                
                const skippedToday =
                    selectedDates.includes(today) &&
                    !validDates.includes(today);
                
                
                // =================================================
                // 截止時間造成的失敗數
                // =================================================
                
                const skippedFailCount =
                    skippedToday ? 1 : 0;
                
                
                // =================================================
                // 最終失敗總數
                // =================================================
                //
                // GAS 回報的失敗
                // +
                // 今天因截止時間被排除的失敗
                //
                
                const totalFailCount =
                    (result.failCount || 0) +
                    skippedFailCount;
                
                
                // =================================================
                // 最終成功數
                // =================================================
                
                const totalSuccessCount =
                    result.successCount || 0;
                
                
                // =================================================
                // 顏色
                // =================================================
                
                if (
                    totalFailCount === 0
                ) {
                
                    status.style.color =
                        "#28a745";
                
                }
                
                else if (
                    totalSuccessCount > 0
                ) {
                
                    status.style.color =
                        "#ff9800";
                
                }
                
                else {
                
                    status.style.color =
                        "#dc3545";
                
                }
                
                
                // =================================================
                // 顯示最後結果
                // =================================================
                
                status.innerHTML = `
                
                    <div class="status-title">
                
                        🎉 報餐處理完成
                
                    </div>
                
                
                    ${skippedToday ? `
                        <div style="
                            color:#dc3545;
                            text-align:center;
                            margin-bottom:12px;
                        ">
                            ⚠️ 今天因已超過報餐截止時間，無法報餐
                        </div>
                    ` : ""}
                
                
                    <div style="
                        text-align:center;
                        margin-bottom:12px;
                    ">
                
                        成功
                        ${result.successCount || 0}
                        天　
                        失敗
                        ${totalFailCount}
                        天
                
                    </div>
                
                
                    ${resultMessages.join("")}
                
                `;
                
                } catch (error) {
                
                    console.error(
                        "報餐系統錯誤：",
                        error
                    );
                
                
                    status.style.color =
                        "#dc3545";
                
                    status.innerHTML =
                        "❌ 報餐處理失敗，請稍後再試。";
                
                }




                // -------------------------------------------------
                // 恢復按鈕
                // -------------------------------------------------

                finally {

                    submitBtn.disabled =
                        false;


                    submitBtn.innerText =
                        "🙋‍♂️ 我要報餐";

                }

            };

        // =================================================
        // 查詢日期區間限制
        // 今天～未來30天
        // =================================================
        
        function initializeQueryDates() {
        
            const startInput =
                document.getElementById(
                    "queryStartDate"
                );
        
            const endInput =
                document.getElementById(
                    "queryEndDate"
                );
        
        
            if (
                !startInput ||
                !endInput
            ) {
        
                return;
        
            }
        
        
            // -------------------------------------------------
            // 今天
            // -------------------------------------------------
        
            const today =
                new Date();
        
        
            const todayStr =
                formatLocalDate(
                    today
                );
        
        
            // -------------------------------------------------
            // 今天 + 30 天
            // -------------------------------------------------
        
            const maxDate =
                new Date(
                    today
                );
        
        
            maxDate.setDate(
                maxDate.getDate() + 30
            );
        
        
            const maxDateStr =
                formatLocalDate(
                    maxDate
                );
        
        
            // -------------------------------------------------
            // 設定 HTML 原生限制
            // -------------------------------------------------
        
            startInput.min =
                todayStr;
        
            startInput.max =
                maxDateStr;
        
        
            endInput.min =
                todayStr;
        
            endInput.max =
                maxDateStr;
        
        
            // -------------------------------------------------
            // 預設日期
            // -------------------------------------------------
        
            startInput.value =
                todayStr;
        
            endInput.value =
                maxDateStr;
        
        
            // =================================================
            // 起始日期變更
            // =================================================
        
            startInput.addEventListener(
                "change",
                function () {
        
                    const selectedDate =
                        this.value;
        
        
                    // ---------------------------------------------
                    // 超過 30 天
                    // ---------------------------------------------
        
                    if (
                        selectedDate > maxDateStr
                    ) {
        
                        alert(
                            "❌ 查詢日期最多只能選擇今天起 30 天內！"
                        );
        
        
                        this.value =
                            todayStr;
        
        
                        return;
        
                    }
        
        
                    // ---------------------------------------------
                    // 今天以前
                    // ---------------------------------------------
        
                    if (
                        selectedDate < todayStr
                    ) {
        
                        alert(
                            "❌ 查詢日期不能選擇今天以前的日期！"
                        );
        
        
                        this.value =
                            todayStr;
        
        
                        return;
        
                    }
        
        
                    // ---------------------------------------------
                    // 起始日期不能晚於結束日期
                    // ---------------------------------------------
        
                    if (
                        endInput.value &&
                        selectedDate > endInput.value
                    ) {
        
                        alert(
                            "❌ 起始日期不能晚於結束日期！"
                        );
        
        
                        this.value =
                            endInput.value;
        
                    }
        
                }
            );
        
        
            // =================================================
            // 結束日期變更
            // =================================================
        
            endInput.addEventListener(
                "change",
                function () {
        
                    const selectedDate =
                        this.value;
        
        
                    // ---------------------------------------------
                    // 超過 30 天
                    // ---------------------------------------------
        
                    if (
                        selectedDate > maxDateStr
                    ) {
        
                        alert(
                            "❌ 查詢日期最多只能選擇今天起 30 天內！"
                        );
        
        
                        this.value =
                            maxDateStr;
        
        
                        return;
        
                    }
        
        
                    // ---------------------------------------------
                    // 今天以前
                    // ---------------------------------------------
        
                    if (
                        selectedDate < todayStr
                    ) {
        
                        alert(
                            "❌ 查詢日期不能選擇今天以前的日期！"
                        );
        
        
                        this.value =
                            todayStr;
        
        
                        return;
        
                    }
        
        
                    // ---------------------------------------------
                    // 結束日期不能早於開始日期
                    // ---------------------------------------------
        
                    if (
                        startInput.value &&
                        selectedDate < startInput.value
                    ) {
        
                        alert(
                            "❌ 結束日期不能早於開始日期！"
                        );
        
        
                        this.value =
                            startInput.value;
        
                    }
        
                }
            );
        
        }


        // =================================================
        // Service Worker
        // =================================================

        if (
            "serviceWorker" in navigator
        ) {


            navigator.serviceWorker
                .register(

                )

            const url =

                "?action=cancelOrder" +
                "&rowNumber=" +
                encodeURIComponent(
                    rowNumber
                );
        
        
                console.log(
                    "取消報餐 API：",
                    url
                );
        
        
                // =================================================
                // 呼叫 Google Apps Script
                // =================================================
        
                const response =
                    await fetch(
                        url
                    );
        
        
                const result =
                    await response.json();
        
        
                console.log(
                    "取消報餐結果：",
                    result
                );
        
        
                // =================================================
                // 取消失敗
                // =================================================
        
                if (
                    !result.success
                ) {
        
                    resultBox.innerHTML = `
                    
                        <div class="result-fail">
                            ❌ ${
                                result.message ||
                                "取消報餐失敗"
                            }
                        </div>
                    
                    `;
        
                    return;
        
                }
        
        
                // =================================================
                // 取消成功
                // =================================================
        
                alert(
                    "✅ 報餐已成功取消！"
                );
        
        
                // =================================================
                // 重新查詢
                // =================================================
        
                await queryOrders();
        
        
            }
        
        
            catch (error) {
        
                console.error(
                    "取消報餐失敗：",
                    error
                );
        
        
                resultBox.innerHTML = `
                
                    <div class="result-fail">
                        ❌ 取消報餐失敗，請稍後再試。
                    </div>
                
                `;
        
            }
        
        }



    </script>


</body>
