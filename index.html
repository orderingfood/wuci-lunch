<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>員工團膳報餐系統</title>


    <!-- =====================================================
         PWA
    ====================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        body {

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

            text-align: center;

            padding: 20px;

            color: #333;

            transition:
                background 0.3s ease;

        }


        /* -------------------------------------------------
           卡片
        ------------------------------------------------- */

        .card {

            background: white;

            max-width: 400px;

            margin: 30px auto;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.1);

        }


        h2 {

            color: #007bff;

            margin-bottom: 20px;

        }


        /* -------------------------------------------------
           輸入區
        ------------------------------------------------- */

        .input-group {

            margin: 20px 0;

            text-align: left;

        }


        .input-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 16px;

            color: #555;

        }


        .input-field {

            display: block;

            width: 100%;

            padding: 12px;

            font-size: 18px;

            border:
                2px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            text-align: center;

        }


        .input-field:focus {

            border-color: #007bff;

            outline: none;

        }


        /* -------------------------------------------------
           按鈕
        ------------------------------------------------- */

        .btn {

            display: block;

            width: 100%;

            padding: 15px;

            margin: 15px 0;

            font-size: 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;

            font-weight: bold;

        }


        .btn-lunch {

            background-color: #28a745;

            color: white;

        }


        .btn-lunch:hover {

            background-color: #218838;

        }


        .btn:disabled {

            background-color: #999;

            cursor: not-allowed;

        }


        /* -------------------------------------------------
           狀態訊息
        ------------------------------------------------- */

        .status {

            margin-top: 20px;

            font-weight: bold;

            font-size: 16px;

            min-height: 24px;

        }


        .hint {

            font-size: 12px;

            color: #888;

            text-align: center;

            margin-top: 5px;

        }


        /* -------------------------------------------------
           午餐 / 晚餐
        ------------------------------------------------- */

        .meal-options {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .meal-option {

            flex: 1;

            cursor: pointer;

        }


        .meal-option input {

            display: none;

        }


        .meal-option span {

            display: block;

            padding: 14px 10px;

            text-align: center;

            border:
                2px solid #ccc;

            border-radius: 8px;

            background-color: #fff;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;

        }


        .meal-option input:checked + span {

            background-color: #007bff;

            color: white;

            border-color: #007bff;

        }


        /* -------------------------------------------------
           分頁
        ------------------------------------------------- */

        .tabs {

            display: flex;

            justify-content:
                space-around;

            margin-bottom: 20px;

            border-bottom:
                2px solid #ddd;

        }


        .tab-btn {

            background: none;

            border: none;

            padding: 10px 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            color: #666;

            border-bottom:
                3px solid transparent;

            transition: 0.2s;

        }


        .tab-btn.active {

            color: #007bff;

            border-bottom-color:
                #007bff;

        }


        .tab-content {

            display: none;

        }


        .tab-content.active {

            display: block;

        }


        /* -------------------------------------------------
           多日日期
        ------------------------------------------------- */

        .date-checkbox-list {

            display: grid;

            grid-template-columns:
                repeat(1, 1fr);

            gap: 10px;

            max-height: 200px;

            overflow-y: auto;

            border:
                2px solid #ccc;

            border-radius: 8px;

            padding: 10px;

            background: #fafafa;

        }


        .date-item {

            display: flex;

            align-items: center;

            padding: 6px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 4px;

            cursor: pointer;

        }


        .date-item input {

            margin-right: 8px;

            transform: scale(1.2);

        }


        /* -------------------------------------------------
           午餐背景
        ------------------------------------------------- */

        body.white-mode {

            background:
                linear-gradient(
                    135deg,
                    #E0F2FE 0%,
                    #FFFBEB 100%
                );

        }


        /* -------------------------------------------------
           晚餐背景
        ------------------------------------------------- */

        body.dark-mode {

            background:
                linear-gradient(
                    135deg,
                    #0F172A 0%,
                    #1E1B4B 100%
                );

        }


        body.dark-mode .card {

            background: #f8fafc;

        }

    </style>

</head>


<body>


    <div class="card">


        <h2>
            員工團膳報餐系統
        </h2>


        <!-- =================================================
             員工工號
        ================================================== -->

        <div class="input-group">

            <label for="empIdInput">

                🆔 員工工號
                (運務士為xxxxx，沒有D)：

            </label>


            <input
                type="text"
                id="empIdInput"
                class="input-field"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="請輸入員工代號"
            >


            <div class="hint">

                ※ 系統會自動記住您的員工代號，
                下次開啟會自動帶入。

            </div>

        </div>


        <!-- =================================================
             姓名
        ================================================== -->

        <div class="input-group">

            <label for="nameInput">

                👤 姓名：

            </label>


            <input
                type="text"
                id="nameInput"
                class="input-field"
                autocomplete="name"
                placeholder="請輸入姓名"
            >


            <div class="hint">

                ※ 系統會自動記住上次輸入的姓名。

            </div>

        </div>


        <!-- =================================================
             公司
        ================================================== -->

        <div class="input-group">

            <label for="companySelect">

                🏢 公司名稱
                (運務士選擇全翔)：

            </label>


            <select
                id="companySelect"
                class="input-field"
            >

                <option value="">
                    請選擇公司
                </option>

                <option value="弘達">
                    弘達
                </option>

                <option value="全翔">
                    全翔
                </option>

                <option value="君獅">
                    君獅
                </option>

                <option value="蘭亭">
                    蘭亭
                </option>

                <option value="專佳人支">
                    專佳人支
                </option>

                <option value="浩翔">
                    浩翔
                </option>

                <option value="華輿">
                    華輿
                </option>

                <option value="聯興">
                    聯興
                </option>

                <option value="全怡(保全)">
                    全怡(保全)
                </option>

            </select>


            <div class="hint">

                ※ 系統會自動記住上次輸入的公司。

            </div>

        </div>


        <!-- =================================================
             單位
        ================================================== -->

        <div class="input-group">

            <label for="unit">

                👨‍👩‍👧‍👦 單位組別
                (運務士選擇運輸)：

            </label>


            <select
                id="unit"
                class="input-field"
            >

                <option value="">
                    請選擇單位
                </option>

                <option value="主辦">
                    主辦
                </option>

                <option value="保全">
                    保全
                </option>

                <option value="運輸">
                    運輸
                </option>

                <option value="出貨組">
                    出貨組
                </option>

                <option value="收貨組">
                    收貨組
                </option>

                <option value="退貨組">
                    退貨組
                </option>

                <option value="保管組">
                    保管組
                </option>

                <option value="揀貨組">
                    揀貨組
                </option>

            </select>


            <div class="hint">

                ※ 系統會自動記住上次輸入的組別。

            </div>

        </div>


        <!-- =================================================
             用餐時段
        ================================================== -->

        <div class="input-group">

            <label>
                用餐時段：
            </label>


            <div class="meal-options">


                <label class="meal-option">

                    <input
                        type="radio"
                        name="mealTime"
                        value="午餐"
                        checked
                        id="white"
                    >

                    <span>
                        ☀️ 午餐
                    </span>

                </label>


                <label class="meal-option">

                    <input
                        type="radio"
                        name="mealTime"
                        value="晚餐"
                        id="black"
                    >

                    <span>
                        🌙 晚餐
                    </span>

                </label>


            </div>

        </div>


        <!-- =================================================
             葷素
        ================================================== -->

        <div class="input-group">

            <label>
                訂餐類別：
            </label>


            <div class="meal-options">


                <label class="meal-option">

                    <input
                        type="radio"
                        name="category"
                        value="葷食"
                        checked
                    >

                    <span>
                        🥩 葷食
                    </span>

                </label>


                <label class="meal-option">

                    <input
                        type="radio"
                        name="category"
                        value="素食"
                    >

                    <span>
                        🥬 素食
                    </span>

                </label>


            </div>

        </div>


        <!-- =================================================
             分頁
        ================================================== -->

        <div class="tabs">


            <button
                class="tab-btn active"
                onclick="switchTab('single')"
                type="button"
            >

                📅 單日報餐

            </button>


            <button
                class="tab-btn"
                onclick="switchTab('multi')"
                type="button"
            >

                🗂️ 多日報餐

            </button>


        </div>


        <!-- =================================================
             單日
        ================================================== -->

        <div
            id="tab-single"
            class="tab-content active"
        >


            <div class="input-group">

                <label for="single-date">

                    選擇報餐日期 (單選)

                </label>


                <input
                    type="date"
                    id="single-date"
                    class="input-field"
                >

            </div>


        </div>


        <!-- =================================================
             多日
        ================================================== -->

        <div
            id="tab-multi"
            class="tab-content"
        >


            <div class="input-group">

                <label>

                    選擇報餐日期 (可多選)

                </label>


                <div
                    id="multi-date-list"
                    class="date-checkbox-list"
                >

                    <!-- JavaScript 自動產生 -->

                </div>

            </div>


        </div>


        <!-- =================================================
             報餐按鈕
        ================================================== -->

        <button
            class="btn btn-lunch"
            id="submitBtn"
            onclick="submitOrder()"
            type="button"
        >

            🙋‍♂️ 我要報餐

        </button>


        <!-- =================================================
             狀態
        ================================================== -->

        <div
            class="status"
            id="statusMsg"
        ></div>


    </div>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script>


        // =================================================
        // Google Apps Script 網址
        //
        // ⚠️ 請把下面網址換成你的 Apps Script /exec 網址
        // =================================================

        const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbz5A0b2thyY6D2ExzqC_IEizobQmFf6mxSHrw2rl7nWaBjsnjqOijuNf13rElb4aQPKUg/exec";


        // =================================================
        // 目前分頁
        // =================================================

        let currentMode = "single";


        // =================================================
        // DOM
        // =================================================

        const inputField =
            document.getElementById(
                "empIdInput"
            );


        const nameInput =
            document.getElementById(
                "nameInput"
            );


        const companySelect =
            document.getElementById(
                "companySelect"
            );


        const unitSelect =
            document.getElementById(
                "unit"
            );


        const status =
            document.getElementById(
                "statusMsg"
            );


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );



        // =================================================
        // localStorage
        // =================================================

        const STORAGE_KEY =
            "company_lunch_employee_id";


        const NAME_STORAGE_KEY =
            "last_employee_name";


        const COMPANY_STORAGE_KEY =
            "last_company";


        const UNIT_STORAGE_KEY =
            "last_unit";



        // =================================================
        // 載入之前儲存的資料
        // =================================================

        try {


            const savedId =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (
                savedId &&
                savedId.trim() !== ""
            ) {

                inputField.value =
                    savedId;

            }


            const savedName =
                localStorage.getItem(
                    NAME_STORAGE_KEY
                );


            if (savedName) {

                nameInput.value =
                    savedName;

            }


            const savedCompany =
                localStorage.getItem(
                    COMPANY_STORAGE_KEY
                );


            if (savedCompany) {

                companySelect.value =
                    savedCompany;

            }


            const savedUnit =
                localStorage.getItem(
                    UNIT_STORAGE_KEY
                );


            if (savedUnit) {

                unitSelect.value =
                    savedUnit;

            }


        } catch (error) {

            console.error(
                "讀取記憶資料失敗：",
                error
            );

        }



        // =================================================
        // 工號輸入
        // =================================================

        inputField.addEventListener(
            "input",
            function () {

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        inputField.value
                    );

                } catch (error) {

                    console.error(error);

                }

            }
        );


        inputField.addEventListener(
            "blur",
            function () {

                const empId =
                    inputField.value
                        .trim()
                        .toUpperCase();


                inputField.value =
                    empId;


                if (empId !== "") {

                    localStorage.setItem(
                        STORAGE_KEY,
                        empId
                    );

                }

            }
        );



        // =================================================
        // 姓名
        // =================================================

        nameInput.addEventListener(
            "input",
            function () {

                localStorage.setItem(
                    NAME_STORAGE_KEY,
                    nameInput.value
                );

            }
        );


        nameInput.addEventListener(
            "blur",
            function () {

                const name =
                    nameInput.value.trim();


                nameInput.value =
                    name;


                if (name !== "") {

                    localStorage.setItem(
                        NAME_STORAGE_KEY,
                        name
                    );

                }

            }
        );



        // =================================================
        // 公司
        // =================================================

        companySelect.addEventListener(
            "change",
            function () {

                localStorage.setItem(
                    COMPANY_STORAGE_KEY,
                    companySelect.value
                );

            }
        );



        // =================================================
        // 單位
        // =================================================

        unitSelect.addEventListener(
            "change",
            function () {

                localStorage.setItem(
                    UNIT_STORAGE_KEY,
                    unitSelect.value
                );

            }
        );



        // =================================================
        // 午餐 / 晚餐背景
        // =================================================

        const whiteInput =
            document.getElementById(
                "white"
            );


        const blackInput =
            document.getElementById(
                "black"
            );


        whiteInput.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    document.body.classList.add(
                        "white-mode"
                    );

                    document.body.classList.remove(
                        "dark-mode"
                    );

                }

            }
        );


        blackInput.addEventListener(
            "change",
            function () {

                if (this.checked) {

                    document.body.classList.add(
                        "dark-mode"
                    );

                    document.body.classList.remove(
                        "white-mode"
                    );

                }

            }
        );



        // =================================================
        // 日期格式化
        // =================================================

        function formatLocalDate(date) {

            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }



        // =================================================
        // 初始化日期
        // =================================================

        function initializeDates() {


            const today =
                new Date();


            // 今天開始
            const startDate =
                new Date(
                    today
                );


            startDate.setDate(
                today.getDate()
            );


            // 本月底
            const endDate =
                new Date(
                    today.getFullYear(),
                    today.getMonth() + 1,
                    0
                );


            const minStr =
                formatLocalDate(
                    startDate
                );


            const maxStr =
                formatLocalDate(
                    endDate
                );


            // -------------------------------------------------
            // 單日
            // -------------------------------------------------

            const singleDateInput =
                document.getElementById(
                    "single-date"
                );


            singleDateInput.min =
                minStr;


            singleDateInput.max =
                maxStr;


            singleDateInput.value =
                minStr;



            // -------------------------------------------------
            // 多日
            // -------------------------------------------------

            const multiContainer =
                document.getElementById(
                    "multi-date-list"
                );


            multiContainer.innerHTML =
                "";


            let tempDate =
                new Date(
                    startDate
                );


            while (
                tempDate <= endDate
            ) {


                const dateStr =
                    formatLocalDate(
                        tempDate
                    );


                const weekDay =
                    [
                        "日",
                        "一",
                        "二",
                        "三",
                        "四",
                        "五",
                        "六"
                    ][
                        tempDate.getDay()
                    ];


                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "date-item";


                label.innerHTML = `

                    <input
                        type="checkbox"
                        name="multi-dates"
                        value="${dateStr}"
                    >

                    ${dateStr}
                    (${weekDay})

                `;


                multiContainer.appendChild(
                    label
                );


                tempDate.setDate(
                    tempDate.getDate() + 1
                );

            }

        }



        // =================================================
        // 切換分頁
        // =================================================

        function switchTab(mode) {


            currentMode =
                mode;


            // 移除按鈕 active
            document
                .querySelectorAll(
                    ".tab-btn"
                )
                .forEach(
                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


            // 對應按鈕
            document
                .querySelectorAll(
                    ".tab-btn"
                )
                .forEach(
                    btn => {

                        if (
                            (
                                mode === "single" &&
                                btn.innerText.includes(
                                    "單日報餐"
                                )
                            )
                            ||
                            (
                                mode === "multi" &&
                                btn.innerText.includes(
                                    "多日報餐"
                                )
                            )
                        ) {

                            btn.classList.add(
                                "active"
                            );

                        }

                    }
                );


            // 隱藏所有內容
            document
                .querySelectorAll(
                    ".tab-content"
                )
                .forEach(
                    content => {

                        content.classList.remove(
                            "active"
                        );

                    }
                );


            // 顯示目前內容
            const targetTab =
                document.getElementById(
                    "tab-" + mode
                );


            if (targetTab) {

                targetTab.classList.add(
                    "active"
                );

            }


            // 清除訊息
            status.innerText =
                "";


            status.style.color =
                "";

        }



        // =================================================
        // 取得選擇日期
        // =================================================

        function getSelectedDates() {


            const dates = [];


            // -------------------------------------------------
            // 單日
            // -------------------------------------------------

            if (
                currentMode === "single"
            ) {


                const date =
                    document
                        .getElementById(
                            "single-date"
                        )
                        .value;


                if (date) {

                    dates.push(
                        date
                    );

                }

            }


            // -------------------------------------------------
            // 多日
            // -------------------------------------------------

            else {


                document
                    .querySelectorAll(
                        'input[name="multi-dates"]:checked'
                    )
                    .forEach(
                        checkbox => {

                            dates.push(
                                checkbox.value
                            );

                        }
                    );

            }


            return dates;

        }



        // =================================================
        // 報餐
        // =================================================

        window.submitOrder =
            async function () {


                // -------------------------------------------------
                // 檢查 Google 網址
                // -------------------------------------------------

                if (
                    !GOOGLE_SCRIPT_URL ||
                    GOOGLE_SCRIPT_URL.includes(
                        "請把你的"
                    )
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 尚未設定 Google Apps Script 網址。";

                    return;

                }



                // -------------------------------------------------
                // 取得資料
                // -------------------------------------------------

                const empId =
                    inputField.value
                        .trim()
                        .toUpperCase();


                const name =
                    nameInput.value
                        .trim();


                const company =
                    companySelect.value;


                const unit =
                    unitSelect.value;


                const mealTime =
                    document
                        .querySelector(
                            'input[name="mealTime"]:checked'
                        )
                        ?.value || "";


                const category =
                    document
                        .querySelector(
                            'input[name="category"]:checked'
                        )
                        ?.value || "";


                const selectedDates =
                    getSelectedDates();



                // -------------------------------------------------
                // 工號
                // -------------------------------------------------

                if (!empId) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 請先輸入您的員工代號！";

                    inputField.focus();

                    return;

                }



                // -------------------------------------------------
                // 姓名
                // -------------------------------------------------

                if (!name) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 請輸入您的姓名！";

                    nameInput.focus();

                    return;

                }



                // -------------------------------------------------
                // 公司
                // -------------------------------------------------

                if (!company) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 請選擇公司！";

                    companySelect.focus();

                    return;

                }



                // -------------------------------------------------
                // 單位
                // -------------------------------------------------

                if (!unit) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 請選擇單位！";

                    unitSelect.focus();

                    return;

                }



                // -------------------------------------------------
                // 日期
                // -------------------------------------------------

                if (
                    selectedDates.length === 0
                ) {

                    status.style.color =
                        "#dc3545";

                    status.innerText =
                        "❌ 請至少選擇一個報餐日期！";

                    return;

                }



                // -------------------------------------------------
                // 防止連續按兩次
                // -------------------------------------------------

                submitBtn.disabled =
                    true;


                submitBtn.innerText =
                    "⏳ 傳送中...";


                status.style.color =
                    "#666";


                status.innerText =
                    "⏳ 正在傳送報餐資料...";



                // -------------------------------------------------
                // 儲存使用者資料
                // -------------------------------------------------

                try {


                    localStorage.setItem(
                        STORAGE_KEY,
                        empId
                    );


                    localStorage.setItem(
                        NAME_STORAGE_KEY,
                        name
                    );


                    localStorage.setItem(
                        COMPANY_STORAGE_KEY,
                        company
                    );


                    localStorage.setItem(
                        UNIT_STORAGE_KEY,
                        unit
                    );


                } catch (error) {

                    console.error(
                        "儲存資料失敗：",
                        error
                    );

                }



                // -------------------------------------------------
                // 開始傳送
                // -------------------------------------------------

                try {


                    let successCount =
                        0;


                    let failMessages =
                        [];


                    // =============================================
                    // 一個日期一個日期傳送
                    // =============================================

                    for (
                        const orderDate
                        of selectedDates
                    ) {


                        const data = {

                            orderDate:
                                orderDate,

                            mealTime:
                                mealTime,

                            category:
                                category,

                            employeeId:
                                empId,

                            name:
                                name,

                            company:
                                company,

                            unit:
                                unit

                        };


                        console.log(
                            "傳送資料：",
                            data
                        );


                        const response =
                            await fetch(
                                GOOGLE_SCRIPT_URL,
                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "text/plain;charset=utf-8"

                                    },

                                    body:
                                        JSON.stringify(
                                            data
                                        )

                                }
                            );



                        // -------------------------------------------------
                        // 讀取 Google 回應
                        // -------------------------------------------------

                        const result =
                            await response.json();


                        console.log(
                            "Google 回應：",
                            result
                        );



                        // -------------------------------------------------
                        // 成功
                        // -------------------------------------------------

                        if (
                            result.success
                        ) {

                            successCount++;

                        }



                        // -------------------------------------------------
                        // 失敗
                        // -------------------------------------------------

                        else {

                            failMessages.push(

                                orderDate +
                                "：" +
                                (
                                    result.message ||
                                    "未知錯誤"
                                )

                            );

                        }

                    }



                    // =================================================
                    // 全部成功
                    // =================================================

                    if (
                        successCount ===
                        selectedDates.length
                    ) {


                        status.style.color =
                            "#28a745";


                        status.innerText =
                            `🎉 報餐成功！共 ${successCount} 天`;


                    }



                    // =================================================
                    // 部分成功
                    // =================================================

                    else if (
                        successCount > 0
                    ) {


                        status.style.color =
                            "#ff9800";


                        status.innerText =
                            `⚠️ 成功 ${successCount} 天，部分日期未成功`;


                        console.log(
                            "未成功日期：",
                            failMessages
                        );


                    }



                    // =================================================
                    // 全部失敗
                    // =================================================

                    else {


                        status.style.color =
                            "#dc3545";


                        status.innerText =
                            "❌ 報餐失敗：" +
                            failMessages.join(
                                "、"
                            );

                    }


                }


                // =================================================
                // 網路錯誤
                // =================================================

                catch (error) {


                    console.error(
                        "Google API 錯誤：",
                        error
                    );


                    status.style.color =
                        "#dc3545";


                    status.innerText =
                        "❌ 無法連線到 Google，請稍後再試。";

                }


                // =================================================
                // 恢復按鈕
                // =================================================

                finally {


                    submitBtn.disabled =
                        false;


                    submitBtn.innerText =
                        "🙋‍♂️ 我要報餐";

                }

            };



        // =================================================
        // PWA Service Worker
        // =================================================

        if (
            "serviceWorker" in navigator
        ) {


            navigator.serviceWorker
                .register(
                    "/sw.js"
                )
                .catch(
                    err => {

                        console.log(
                            "Service Worker 註冊失敗：",
                            err
                        );

                    }
                );

        }



        // =================================================
        // 網頁載入完成
        // =================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                initializeDates();

            }
        );


    </script>


</body>

</html>
